<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>SmartCare - Login</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/auth.css"><link rel="stylesheet" href="css/responsive.css"></head><body><section class="auth-page"><div class="auth-left"><div class="auth-logo"><img src="images/logofiks.png" alt="SmartCare"></div><h1>SmartCare</h1><p>Early Detection, Better Protection</p></div><div class="auth-right"><form class="auth-card" data-auth="login"><h2>Welcome Back</h2><p>Login to continue monitoring your health.</p><div class="field"><label for="email">Email</label><div class="form-icon"><span>✉</span><input id="email" type="email" placeholder="smartcare@email.com" required></div></div><div class="field"><label for="password">Password</label><div class="form-icon"><span>🔒</span><input id="password" type="password" placeholder="••••••••" required></div></div><div class="auth-row"><label><input type="checkbox"> Remember me</label><a href="#">Forgot Password</a></div><button class="btn btn-primary ripple" style="width:100%;margin-top:18px">Login</button><div class="divider">or</div><p class="switch">No account? <a href="register.html">Create Account</a></p></form></div></section><script src="js/app.js"></script></body></html>
