<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>SmartCare - Register</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/auth.css"><link rel="stylesheet" href="css/responsive.css"></head><body><section class="auth-page"><div class="auth-left"><div class="auth-logo"><img src="images/logofiks.png" alt="SmartCare"></div><h1>SmartCare</h1><p>Early Detection, Better Protection</p></div><div class="auth-right"><form class="auth-card" data-auth="register"><h2>Create Account</h2><p>Register your account to access healthcare monitoring.</p><div class="field"><label for="fullname">Full Name</label><div class="form-icon"><span>👤</span><input id="fullname" type="text" placeholder="Your full name" required></div></div><div class="field"><label for="email">Email</label><div class="form-icon"><span>✉</span><input id="email" type="email" placeholder="smartcare@email.com" required></div></div><div class="field"><label for="password">Password</label><div class="form-icon"><span>🔒</span><input id="password" type="password" placeholder="Min. 6 characters" required></div><button type="button" class="show-pass" data-target="password">Show password</button></div><div class="field"><label for="confirmPassword">Confirm Password</label><div class="form-icon"><span>🔒</span><input id="confirmPassword" type="password" placeholder="Repeat password" required></div><button type="button" class="show-pass" data-target="confirmPassword">Show password</button></div><div class="auth-row"><label><input type="checkbox"> I agree with terms</label></div><button class="btn btn-primary ripple" style="width:100%;margin-top:18px">Register</button><div class="divider">or</div><p class="switch">Already have account? <a href="login.html">Login</a></p></form></div></section><script src="js/app.js"></script></body></html>
